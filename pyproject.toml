[project]
name = "mamona"
version = "0.1.0"
description = "Monthly budget tracker with natural-language transaction input and an AI financial copilot."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.20.0",
    "fastapi[standard]>=0.143.0",
    "langchain>=1.4.6",
    "langchain-ollama>=1.1.0",
    "langsmith>=0.14.9",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.4",
    "sqlalchemy>=2.1.4",
    "tavily>=1.1.0",
    "typesafe-sdk>=0.7.4",
]
